# This is a Declarative Automation Bundle definition for databricks_07.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: databricks_07
  uuid: 1dcabd0a-13d3-438b-b99d-88dd0b01c9bc

include:
  - resources/*.yml

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
  schema:
    description: The schema to use

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://dbc-099e2b16-6c53.cloud.databricks.com
    variables:
      catalog: retail_project
      schema: dev
  prod:
    mode: production
    workspace:
      host: https://dbc-099e2b16-6c53.cloud.databricks.com
      # We explicitly deploy to /Workspace/Users/tahlaniakshay@gmail.com to make sure we only have a single copy.
      root_path: /Workspace/Users/tahlaniakshay@gmail.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: retail_project
      schema: prod
    permissions:
      - user_name: tahlaniakshay@gmail.com
        level: CAN_MANAGE
